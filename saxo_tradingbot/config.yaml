name: Saxo tradingbot
version: "0.2.0"
slug: saxo_tradingbot
description: Swing (RSI2) + daytrading (VWAP-dip) mod Saxo OpenAPI (simulering) med sensorer i Home Assistant.
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:chart-line
panel_title: Tradingbot
options:
  app_key: ""
  environment: sim
  trade_enabled: true
  swing_enabled: true
  day_enabled: true
  budget_dkk: 10000
  day_budget_dkk: 10000
  day_max_positions: 2
  day_vwap_dip_pct: 1.0
  day_stop_pct: 1.0
  day_max_trades: 6
  max_positions: 2
  rsi_entry: 10
  sma_trend: 200
  sma_exit: 5
  max_hold_days: 10
  stop_loss_pct: 8
  usd_dkk: 6.5
  eur_dkk: 7.46
  notify_service: ""
  universe:
    - NOVOb:xcse
    - DSV:xcse
    - MAERSKb:xcse
    - DANSKE:xcse
    - CARLb:xcse
    - COLOb:xcse
    - GMAB:xcse
    - PNDORA:xcse
    - VWS:xcse
    - NSISb:xcse
    - DEMANT:xcse
    - TRYG:xcse
    - AAPL:xnas
    - MSFT:xnas
    - NVDA:xnas
    - AMZN:xnas
    - GOOGL:xnas
    - META:xnas
    - JPM:xnys
    - V:xnys
schema:
  app_key: password
  environment: list(sim)
  trade_enabled: bool
  swing_enabled: bool
  day_enabled: bool
  budget_dkk: int(1000,)
  day_budget_dkk: int(1000,)
  day_max_positions: int(1,10)
  day_vwap_dip_pct: float(0.1,10)
  day_stop_pct: float(0.1,10)
  day_max_trades: int(1,50)
  max_positions: int(1,10)
  rsi_entry: int(1,50)
  sma_trend: int(20,300)
  sma_exit: int(2,50)
  max_hold_days: int(1,60)
  stop_loss_pct: int(1,50)
  usd_dkk: float
  eur_dkk: float
  notify_service: str?
  universe:
    - str
